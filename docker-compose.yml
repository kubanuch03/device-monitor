services:
  device-monitor:
    build: .
    container_name: device-monitor
    restart: unless-stopped

    # network_mode: host - обязателен, а не удобство. Проверка доступности идёт
    # с сервера, а не из браузера, поэтому контейнер должен видеть ровно те же
    # сети, что и хост: VPN-маршруты (WireGuard, OpenVPN) живут на хосте и в
    # обычную bridge-сеть Docker не попадают. В host-режиме проброс портов не
    # применяется - адрес и порт задаются через DM_HOST/DM_PORT ниже.
    network_mode: host

    # Каталог data монтируется с хоста, поэтому процесс в контейнере обязан
    # совпадать по uid с владельцем этого каталога - иначе сохранение списка
    # падает с PermissionError. 1000:1000 - обычный первый пользователь в
    # Linux; если у вас другой, задайте DM_UID/DM_GID (посмотреть: id -u, id -g).
    user: "${DM_UID:-1000}:${DM_GID:-1000}"

    environment:
      # 127.0.0.1 - панель доступна только с этой машины. Поставьте 0.0.0.0,
      # только если сознательно открываете её коллегам по локальной сети:
      # авторизации у сервиса нет.
      DM_HOST: "127.0.0.1"
      DM_PORT: "8890"
      # Пароль панели. Пока он пустой, панель открыта без входа - это
      # допустимо для списка одних адресов, но сохранение учёток от железа
      # в таком режиме сервис запретит: открытая панель с паролями камер
      # означает, что доступ ко всему оборудованию получает любой, кто
      # дотянулся до порта.
      DM_PASSWORD: "${DM_PASSWORD:-}"

      DM_POLL_INTERVAL: "30"   # секунд между кругами опроса
      DM_PROBE_TIMEOUT: "3"    # секунд ждать TCP-коннекта

      # Параллельность опроса. Дефолт (32) безопасен только для точек с прямым
      # доступом. Для точки за SOCKS-туннелем все проверки идут каналами через
      # один ssh -D, и полтора десятка одновременных каналов заставляют sshd
      # не успевать отвечать на keepalive: ssh считает живой канал мёртвым и
      # рвёт соединение. На объекте Балыкчы это давало обрыв туннеля раз в
      # 45-80 секунд; лечится не таймингами keepalive, а снижением параллельности.
      DM_WORKERS: "6"

    volumes:
      # База с устройствами и историей переживает пересборку образа.
      - ./data:/app/data
      # Статика монтируется с хоста: правка фронта подхватывается
      # перезапуском контейнера, без пересборки образа.
      - ./static:/app/static:ro

  # Медиасервер для просмотра камер из дашборда. Браузер не умеет RTSP —
  # go2rtc переупаковывает поток в WebRTC/MSE, дашборд только показывает его
  # плеер. Нужен для объектов, где своего go2rtc нет (Ала-Арча, Кызыл-Кия);
  # у Балыкчы используется тот, что уже стоит на самом объекте.
  #
  # network_mode: host по той же причине, что и у монитора — VPN-маршруты до
  # камер живут на хосте и в bridge-сеть Docker не попадают.
  #
  # Конфиг содержит пароли камер, поэтому монтируется read-only и лежит вне
  # образа. API слушает 127.0.0.1: наружу отдавать видео с камер нельзя.
  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: device-monitor-go2rtc
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config/go2rtc.yaml:/config/go2rtc.yaml:ro

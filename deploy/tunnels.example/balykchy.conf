# Настройки туннеля до объекта «Балыкчи».
# Кладётся в /etc/device-monitor/tunnels/balykchy.conf
#
# SSH_TARGET — как в `ssh <target>`: алиас из ~/.ssh/config или user@host.
# SOCKS_PORT — локальный порт SOCKS; он же прописывается в поле прокси точки
#              в панели: socks5://127.0.0.1:<этот порт>.
SSH_TARGET=balykchy
SOCKS_PORT=1081

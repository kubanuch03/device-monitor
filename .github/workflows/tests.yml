# Тесты на каждый push и pull request - проверка, которая не зависит ни от
# чьего компьютера.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Тесты релея и скана поднимают локальные сокеты на 127.0.0.1 -
      # на раннере GitHub это работает без настроек.
      - run: python -m pytest -q
      - name: Синтаксис фронтенда
        run: node --check static/app.js && node --check static/streams.js

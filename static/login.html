<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device Monitor — вход</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-body">
  <form class="login-card" id="login-form">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Device Monitor</span>
    </div>
    <p class="login-hint">Панель хранит учётные данные оборудования, поэтому закрыта входом.</p>

    <div class="field">
      <label for="username">Логин</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus value="admin">
    </div>
    <div class="field">
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>

    <p class="form-error" id="login-error" hidden></p>
    <button type="submit" class="primary" id="login-submit">Войти</button>
  </form>

<script>
"use strict";
const form = document.getElementById("login-form");
const error = document.getElementById("login-error");
const submit = document.getElementById("login-submit");

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  error.hidden = true;
  submit.disabled = true;
  submit.textContent = "Проверяю…";
  try {
    const response = await fetch("/api/v1/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: form.username.value, password: form.password.value }),
    });
    if (response.ok) {
      location.replace("/");
      return;
    }
    const body = await response.json().catch(() => null);
    error.textContent = (body && body.detail) || `Ошибка ${response.status}`;
    error.hidden = false;
    form.password.value = "";
    form.password.focus();
  } catch (e) {
    error.textContent = "Сервис не отвечает";
    error.hidden = false;
  } finally {
    submit.disabled = false;
    submit.textContent = "Войти";
  }
});
</script>
</body>
</html>
